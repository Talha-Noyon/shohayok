<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shohayok</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <h1>Shohayok <span class="bn">সহায়ক</span></h1>
        <p>
          Support assistant for Nodi, a fictional clothing shop in Bangladesh. Ask in English,
          <span class="bn">বাংলা</span> or Banglish.
        </p>
      </header>

      <section class="samples" aria-label="Sample questions">
        <button type="button" data-sample="How much is delivery inside Dhaka?">
          How much is delivery inside Dhaka?
        </button>
        <button type="button" class="bn" data-sample="জামদানি শাড়ির দাম কত?">
          জামদানি শাড়ির দাম কত?
        </button>
        <button type="button" data-sample="tangail sharee er dam koto?">
          tangail sharee er dam koto?
        </button>
        <button type="button" data-sample="Do you sell iPhone chargers?">
          Do you sell iPhone chargers?
        </button>
      </section>

      <section id="log" class="log" aria-live="polite"></section>

      <form id="composer" class="composer">
        <label for="question" class="visually-hidden">Your question</label>
        <input
          id="question"
          name="question"
          autocomplete="off"
          maxlength="500"
          placeholder="Ask about products, delivery, payment or returns"
          required
        />
        <button type="submit">Send</button>
      </form>

      <footer id="status" class="status"></footer>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
